475569"/><text x="753" y="766" class="label">ENTRY · +Z</text><text x="540" y="815" class="label">Every small square = 2×2 studs</text><text x="540" y="848" class="label">6-stud clear approach · 8-stud entrance</text><text x="540" y="881" class="label">Walls and circulation reduce usable furniture area.</text><text x="540" y="914" class="label">Pivots: floor-centred · rotations: 0/90/180/270°</text></svg>