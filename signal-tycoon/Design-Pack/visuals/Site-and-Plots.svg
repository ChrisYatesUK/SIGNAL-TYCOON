<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 970" role="img"><title>Twelve plot site and grid layout</title><rect width="100%" height="100%" fill="#f1f5f9"/><style>text{font-family:Arial,sans-serif;fill:#1e293b}.title{font-size:30px;font-weight:bold}.label{font-size:16px}.small{font-size:13px}</style><text x="36" y="48" class="title">Twelve studios. One fixed site.</text><text x="36" y="80" class="label">All P01–P12 claimable at launch · every envelope reserves 48×48 studs</text><rect x="76.0" y="102.4" width="288.0" height="763.2" rx="0" fill="#d9e6e9" stroke="none"/><rect x="176.8" y="116.8" width="86.4" height="86.4" rx="0" fill="white" stroke="#475569"/><text x="187.6" y="160.0" class="small">LOBBY</text><rect x="205.6" y="203.2" width="28.8" height="655.2" rx="0" fill="#e2e8f0" stroke="none"/><rect x="104.8" y="224.8" width="86.4" height="86.4" rx="0" fill="white" stroke="#8b5cf6"/><rect x="126.39999999999999" y="246.4" width="43.2" height="43.2" rx="0" fill="#cffafe" stroke="#22d3ee"/><text x="122.8" y="273.4" class="label">P01</text><rect x="191.2" y="260.8" width="14.4" height="14.4" rx="0" fill="#f1f5f9" stroke="none"/><rect x="248.8" y="224.8" width="86.4" height="86.4" rx="0" fill="white" stroke="#8b5cf6"/><rect x="270.4" y="246.4" width="43.2" height="43.2" rx="0" fill="#cffafe" stroke="#22d3ee"/><text x="266.8" y="273.4" class="label">P02</text><rect x="234.4" y="260.8" width="14.4" height="14.4" rx="0" fill="#f1f5f9" stroke="none"/><rect x="104.8" y="332.8" width="86.4" height="86.4" rx="0" fill="white" stroke="#8b5cf6"/><rect x="126.39999999999999" y="354.4" width="43.2" height="43.2" rx="0" fill="#cffafe" stroke="#22d3ee"/><text x="122.8" y="381.4" class="label">P03</text><rect x="191.2" y="368.8" width="14.4" height="14.4" rx="0" fill="#f1f5f9" stroke="none"/><rect x="248.8" y="332.8" width="86.4" height="86.4" rx="0" fill="white" stroke="#8b5cf6"/><rect x="270.4" y="354.4" width="43.2" height="43.2" rx="0" fill="#cffafe" stroke="#22d3e